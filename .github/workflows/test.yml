name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vacation:vacation@localhost:5432/vacation_test
      TEST_DATABASE_URL: postgresql+psycopg://vacation:vacation@localhost:5432/vacation_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Migrate (up, down, up again)
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: Migrations match the models
        run: uv run alembic check
      - run: uv run pytest
      - name: Front-end API schema is up to date
        run: uv run python scripts/export_openapi.py && git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.json
        run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
